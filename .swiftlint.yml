# Tidy SwiftLint 配置

# 目标平台：macOS 12+
# 开发工具：Xcode 14.1+ / Swift 5.7+
# 质量政策：Greenfield 零新增违规

included:
  - Sources
  - Tests

excluded:
  - .build
  - .git
  - Packages

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - private_outlet
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

disabled_rules: []

line_length:
  warning: 120
  error: 120

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 40
  error: 60

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

reporter: "xcode"
strict: true
